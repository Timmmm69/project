name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: russian_tests_mvp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d russian_tests_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/russian_tests_mvp?schema=acc01a_recovery_ci
      SESSION_SECRET: ci_session_secret_for_build_only_1234567890
      ACCESS_CODE_HASH_PEPPER: ci_access_code_pepper_1234567890

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm prisma validate
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Apply migrations for ACC-01A integration
        run: pnpm prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Run unit tests
        run: pnpm test
      - name: Run verified student session PostgreSQL integration tests
        env:
          RUN_ACC01A_INTEGRATION: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/russian_tests_mvp?schema=acc01a_recovery_ci
        run: pnpm exec vitest run tests/integration/verified-student-session-service.test.ts
      - name: Run ACC-01A recovery PostgreSQL integration tests
        env:
          RUN_ACC01A_RECOVERY_INTEGRATION: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/russian_tests_mvp?schema=acc01a_recovery_ci
        run: pnpm exec vitest run tests/integration/recovery-domain-service.test.ts
      - name: Run ACC-01A recovery HTTP boundary PostgreSQL integration tests
        env:
          RUN_ACC01A_HTTP_INTEGRATION: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/russian_tests_mvp?schema=acc01a_recovery_ci
        run: pnpm exec vitest run tests/integration/recovery-http-boundary.test.ts
      - name: Run ACC-01A recovery state resolver PostgreSQL integration tests
        env:
          RUN_ACC01A_STATE_RESOLVER_INTEGRATION: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/russian_tests_mvp?schema=acc01a_recovery_ci
        run: pnpm exec vitest run tests/integration/recovery-state-resolver.test.ts
      - name: Run ACC-01A recovery continuation PostgreSQL integration tests
        env:
          RUN_ACC01A_CONTINUATION_INTEGRATION: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/russian_tests_mvp?schema=acc01a_recovery_ci
        run: pnpm exec vitest run tests/integration/recovery-continuation-exchange.test.ts
      - name: Run ACC-01A verified destination guards PostgreSQL integration tests
        env:
          RUN_ACC01A_DESTINATION_GUARDS_INTEGRATION: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/russian_tests_mvp?schema=acc01a_recovery_ci
        run: pnpm exec vitest run tests/integration/verified-destination-guards.test.ts
      - run: pnpm build
